[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "classifier-generator"
version = "0.2.0"
description = "Reusable scikit-learn model selection and evaluation engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "joblib>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
classifier-generator = "classifier_generator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
